http:
  #region routers
  routers:
    #PORTAINER
    portainer:
      entryPoints:
        - "https"
      rule: "Host(`port.argaceve.com`)"
      middlewares:
        - default-headers
        - https-redirect
      tls:
        certResolver: "cloudflare"
      service: portainer

    #VAULTWARDEN
    vault-warden:
      entryPoints:
        - "https"
      rule: "Host(`passvault.argaceve.com`)"
      middlewares:
        - default-headers
        - https-redirect
      tls:
        certResolver: "cloudflare"
      service: vault-warden

    #HEADSCALE
    headscale:
      entryPoints:
        - "https"
      rule: "Host(`hs.argaceve.com`)"
      middlewares:
        - default-headers
        - https-redirect
        - headscale-cors
      tls:
        certResolver: "cloudflare"
      service: headscale

    #HEADSCALE UI
    headscale-ui:
      entryPoints:
        - "https"
      rule: "Host(`hsui.argaceve.com`)"
      middlewares:
        - default-headers
        - https-redirect
        - headscale-ui-auth
      tls:
        certResolver: "cloudflare"
      service: headscale-ui

    #UNIFI (Protected with Authelia)
    unifi:
      entryPoints:
        - "https"
      rule: "Host(`unifi.argaceve.com`)"
      middlewares:
        - default-headers
        - https-redirect
        - authelia-forward-auth  # <-- Added Authelia Middleware
      tls:
        certResolver: "cloudflare"
      service: unifi

    #AUTHELIA
    authelia:
      entryPoints:
        - "https"
      rule: "Host(`authelia.argaceve.com`)"
      middlewares:
        - default-headers
      tls:
        certResolver: "cloudflare"
      service: authelia

    #OPEN MEDIA VAULT
    omv:
      entryPoints:
        - "https"
      rule: "Host(`omv.arkasri.com`)"
      middlewares:
        - default-headers
        - https-redirect
        - authelia-forward-auth  # Verifies auth against local Authelia container
      tls:
        certResolver: "cloudflare"
      service: omv-remote
  #endregion

  #region services
  services:
    #PORTAINER
    portainer:
      loadBalancer:
        servers:
          - url: "https://23.95.205.205:9443"
        passHostHeader: true

    #VAULTWARDEN
    vault-warden:
      loadBalancer:
        servers:
          - url: "http://23.95.205.205:8082"
        passHostHeader: true

    #HEADSCALE
    headscale:
      loadBalancer:
        servers:
          - url: "http://23.95.205.205:8088"
        passHostHeader: true

    #HEADSCALE-UI
    headscale-ui:
      loadBalancer:
        servers:
          - url: "http://23.95.205.205:8089"
        passHostHeader: true

    #UNIFI (Switched to container hostname over internal Docker network)
    unifi:
      loadBalancer:
        servers:
          - url: "https://unifi:8443"  # <-- Connects directly over the 'proxy' Docker network
        passHostHeader: true

    #AUTHELIA
    authelia:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"
        passHostHeader: true
    
    #OPEN MEDIA VAULT
    omv-remote:
      loadBalancer:
        servers:
          # Put Server 2's IP address here (e.g., Tailscale IP or Server 2 Public IP)
          # DO NOT use 23.95.205.205 here, or Traefik will proxy back to itself in a loop
          - url: "https://omv.arkasri.com"  
        passHostHeader: true
  #endregion

  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipWhiteList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"

    headscale-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - OPTIONS
        accessControlAllowOriginList:
          - "https://hsui.argaceve.com"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100

    headscale-ui-auth:
      basicAuth:
        users:
          - "hsadmin:$2y$05$xCc8/l98mEwDiTBccZi/puVkUB/A.eG7rUYz.OOHFwBY3wrqqyrVi"

    # Authelia 4.x ForwardAuth Endpoint Configuration
    authelia-forward-auth:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"  # <-- Updated to Authelia v4 endpoint
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email